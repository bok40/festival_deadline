<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEADLINE FESTIVAL // SIGNAL_001</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="audio.css">
</head>

<body id="festival-entrance">
  <main class="entrance" id="entranceScreen">

    <section class="intro-video-wrap" aria-label="Abertura visual do festival">
      <video
        id="introVideo"
        class="intro-video"
        src="video/deadline-intro.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="auto">
      </video>
    </section>

    <section class="right-column" aria-label="Informações do festival">
      <div class="festival-info">
        <h1>DEADLINE FESTIVAL</h1>

        <div class="info-block">
          <p>SIGNAL_001</p>
          <p>MORUMBIS // SÃO PAULO</p>
          <p>17—19 OCT</p>
        </div>
        <div class="entry-highlights" aria-label="Destaques da lineup">
          <span>MATUÊ</span><span>METALLICA</span><span>PLAYBOI CARTI</span>
        </div>
      </div>

      <a class="enter-cta" id="enterButton" href="home.html">
        [ CLICK HERE TO <span class="blood">CROSS THE DEADLINE</span> ]
      </a>
      <div class="sound-warning" aria-label="Aviso de som">
        <div><span class="sound-warning-mark">⚠</span> SOUND ON // THIS SITE CONTAINS AUDIO</div>
        <span>DEADLINE BEAT STARTS AFTER CROSSING THE LINE</span>
      </div>
    </section>
  </main>

  
  <div class="grain" aria-hidden="true"></div>
  <div class="scanline" aria-hidden="true"></div>
  <div class="flash" aria-hidden="true"></div>

  
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
